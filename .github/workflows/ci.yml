name: CI

# Every pull request: typecheck, lint, unit tests, database tests (migrations from zero and RLS)
# and the end-to-end test of the main flow. Tests run against a local Supabase started in the job,
# the analysis against a fake Anthropic API: no secret is needed and nothing reaches real services.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint

  tests:
    name: Test, database ed end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: pnpm install --frozen-lockfile

      - name: Start Supabase (migrations from zero and seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Write .env.local with the local Supabase keys
        run: |
          supabase status -o env | sed -n \
            -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' \
            -e 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p' \
            -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' > .env.local
          test "$(wc -l < .env.local)" -eq 3

      - name: Database tests (RLS)
        run: pnpm exec vitest run src/test/rls.test.ts
      - name: Database tests (SQL rules the API cannot isolate)
        run: supabase test db
      - name: Unit tests
        run: pnpm exec vitest run --exclude src/test/rls.test.ts

      - name: Build
        run: pnpm build
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end test
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
